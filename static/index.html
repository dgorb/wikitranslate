<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>wikitranslate</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="/scripts.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-gray-100 font-extralight">
        <div class="w-full bg-gray-50 shadow-md border-b-[1px] border-blue-200">
            <div class="max-w-3xl mx-auto bg-gray-50">
                <h1 class="text-xl lowercase py-4 text-center">
                    wikitranslate
                </h1>
            </div>
        </div>
        <div class="max-w-3xl mx-auto p-5">
            <div
                class="bg-white p-6 rounded-md shadow-lg border-[1px] border-blue-200 inset-shadow-sm shadow-[0_4px_0_0_rgba(0,0,0,0.2)]"
            >
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col">
                            <select
                                id="inputLang"
                                class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            ></select>
                        </div>
                        <div class="flex flex-col">
                            <select
                                id="outputLang"
                                class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            ></select>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <input
                            type="text"
                            id="input"
                            placeholder="Enter word or phrase"
                            class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none"
                        />
                    </div>
                    <button
                        onclick="performTranslation()"
                        class="w-full bg-blue-200 text-black py-2 px-4 rounded-sm shadow-md border border-[1px] border-blue-300 hover:bg-blue-300 hover:border-blue-400 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        Translate
                    </button>
                    <div
                        id="results"
                        class="mt-4 p-4 border border-[1px] shadow-md border-gray-200 rounded-sm bg-gray-50 font-light hidden"
                    >
                        <div id="translation"></div>
                        <div
                            id="summary"
                            class="mt-6 text-gray-500 text-xs italic border-l-[1px] border-gray-400 ml-1 pl-3"
                        ></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
