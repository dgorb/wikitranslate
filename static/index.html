<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>wikitranslate</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-gray-100 font-extralight">
        <div class="w-full bg-off-white bg-gray-50 shadow-md">
            <h1
                class="text-xl mb-6 lowercase py-4 pl-14 border-b-[1px] border-blue-200"
            >
                Wikitranslate
            </h1>
        </div>
        <div class="max-w-3xl mx-auto p-5">
            <div
                class="bg-white p-6 rounded-md shadow-lg border-[1px] border-blue-200 inset-shadow-sm shadow-[0_4px_0_0_rgba(0,0,0,0.2)]"
            >
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col">
                            <select
                                id="inputLang"
                                class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            ></select>
                        </div>
                        <div class="flex flex-col">
                            <select
                                id="outputLang"
                                class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            ></select>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <input
                            type="text"
                            id="input"
                            placeholder="Enter word or phrase"
                            class="p-2 border border-gray-300 rounded-sm shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    <button
                        onclick="performTranslation()"
                        class="w-full bg-blue-200 text-black py-2 px-4 rounded-sm shadow-md border border-[1px] border-blue-300 hover:bg-blue-300 hover:border-blue-400 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        Translate
                    </button>
                    <div
                        id="result"
                        class="mt-4 p-4 border border-[1px] shadow-md border-gray-200 rounded-sm bg-gray-50 hidden"
                    ></div>
                </div>
            </div>
        </div>
        <script>
            let languages = {};
            async function populateLanguageDropdowns() {
                try {
                    const response = await fetch("/languages");
                    if (!response.ok) {
                        throw new Error("Failed to fetch languages");
                    }
                    languages = await response.json();

                    const inputLang = document.getElementById("inputLang");
                    const outputLang = document.getElementById("outputLang");

                    inputLang.innerHTML = "";
                    outputLang.innerHTML = "";

                    const sortedLanguages = Object.entries(languages).sort(
                        (a, b) => a[1].localeCompare(b[1]),
                    );

                    for (const [code, name] of sortedLanguages) {
                        const option1 = new Option(name, code);
                        const option2 = new Option(name, code);

                        inputLang.add(option1);
                        outputLang.add(option2);

                        if (code === "en") inputLang.value = code;
                        if (code === "nb") outputLang.value = code;
                    }
                } catch (error) {
                    console.error("Error loading languages:", error);
                    const resultDiv = document.getElementById("result");
                    resultDiv.classList.remove("hidden");
                    resultDiv.innerHTML = `<div class="text-red-600">Error loading languages: ${error.message}</div>`;
                }
            }

            async function performTranslation() {
                const inputLang = document.getElementById("inputLang").value;
                const outputLang = document.getElementById("outputLang").value;
                const input = document.getElementById("input").value;
                const resultDiv = document.getElementById("result");
                resultDiv.classList.remove("hidden");

                if (!input.trim()) {
                    resultDiv.innerHTML =
                        '<div class="text-red-600">Please enter a word to translate</div>';
                    return;
                }

                try {
                    const response = await fetch(
                        `/translate?inputLang=${inputLang}&outputLang=${outputLang}&input=${encodeURIComponent(input)}`,
                    );
                    const data = await response.json();
                    if (response.ok) {
                        resultDiv.innerHTML = `
                            <div class="font-light">${input.charAt(0).toUpperCase() + input.slice(1)} (${inputLang})  →  ${data.translation} (${outputLang})</div>
                        `;
                    } else {
                        resultDiv.innerHTML = `<div class="text-red-600">Translation failed</div>`;
                    }
                } catch (error) {
                    resultDiv.innerHTML = `<div class="text-red-600">Translation not found</div>`;
                }
            }

            document.addEventListener(
                "DOMContentLoaded",
                populateLanguageDropdowns,
            );
        </script>
    </body>
</html>
